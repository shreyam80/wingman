camera:
  sensor_width_px: 1920
  sensor_height_px: 1200
  orientation: portrait
  fov_vertical_deg: 70
  tilt_deg: 0
  fps: 30
flight:
  distance_to_wall_m: 3.0
  mode: elevator
loop:
  rate_hz: 5
  latency_s: 0.15
detector:
  model: yolo11s.pt
  imgsz: 640
  conf: 0.15
  tracker: configs/bytetrack.yaml
lock:
  mode: hybrid
  start: tap
  lock_radius_frac: 0.25
  reacquire_window_s: 2.0
  reacquire_radius_frac: 0.15
  reacquire_size_ratio: 2.0
hybrid:
  tracker_model: models/vittrack.onnx
  min_tracker_score: 0.3
  detect_every_n: 1
  agree_iou: 0.3
  max_unconfirmed_s: 2.0
controller:
  target_point_frac: 0.5
  deadband_frac: 0.05
  kp: 0.8
  ki: 0.0
  kd: 0.1
  max_speed_mps: 0.5
  max_accel_mps2: 0.8
sim:
  response_time_s: 0.3
  min_view_center_m: 0.0
  max_view_center_m: 7.0
  render_scale: 0.5
  wrong_person_iou: 0.2
  min_sharpness_ratio: 0.75
px4:
  address: udpin://0.0.0.0:14540
